name: US -> FR REAL video-to-video | 15s presenter + French dub

on:
  push:
    branches: [production/us-fr-v2v-real-video-pilot-20261029]
    paths:
      - productions/US-FR-V2V-REAL-20261029/START_REAL_15S_V2V_ONCE.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: sqv-premium12-modal-gpu
  cancel-in-progress: false

jobs:
  real_15s_v2v:
    if: github.event.head_commit.message == 'RUN_US_FR_REAL_V2V_15S_ONE_GPU_ONCE' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: '1'
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      STUDIO_MODAL_WORKSPACE: lucj76861
      PY: productions/US-FR-V2V-REAL-20261029/render_v2v_15s.py
      OUTPUT: productions/US-FR-V2V-REAL-20261029/OUTPUT
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            deploy
            productions/US-FR-V2V-REAL-20261029
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify single execution authorization + Modal secret presence
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat productions/US-FR-V2V-REAL-20261029/START_REAL_15S_V2V_ONCE.txt)" = "ONE_SOURCE_GUIDED_V2V_GPU_AUTHORIZED_20261029"
          test -n "${MODAL_TOKEN_ID:-}"
          test -n "${MODAL_TOKEN_SECRET:-}"
          python -m py_compile "$PY"
      - name: Obtain fixed 15-second real source selected in CPU-only scan
        uses: actions/download-artifact@v4
        with:
          name: REAL-US-FR-SOURCE-PROBE-40898616414
          run-id: 40898616414
          github-token: ${{ github.token }}
          path: productions/US-FR-V2V-REAL-20261029/OUTPUT
      - name: Install pinned Modal client, French TTS and ffmpeg (CPU)
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg || ! command -v ffprobe; then
            timeout 90s sudo apt-get install -y ffmpeg || { timeout 90s sudo apt-get update -qq; timeout 90s sudo apt-get install -y ffmpeg; }
          fi
          python -m pip install --disable-pip-version-check 'modal==1.6.1' 'edge-tts>=7,<8' 'piper-tts==1.3.0'
      - name: Confirm original source hash + video guide graph 361 frames (CPU)
        timeout-minutes: 4
        run: python "$PY" prepare
      - name: Make new real French spoken audio without a GPU
        timeout-minutes: 5
        run: python "$PY" voice
      - name: ONE L40S source-guided V2V render with existing Modal worker (NO DEPLOY)
        timeout-minutes: 28
        run: python "$PY" render --confirm-spend oui
      - name: Replace source audio with French speech and verify MP4 (CPU)
        timeout-minutes: 4
        run: python "$PY" finish
      - name: Preserve real source guide, output, French dub and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: US-FR-REAL-V2V-15S-${{ github.run_id }}
          path: |
            ${{ env.OUTPUT }}/reference-15s.mp4
            ${{ env.OUTPUT }}/selected_15s_contact.jpg
            ${{ env.OUTPUT }}/source_report.json
            ${{ env.OUTPUT }}/guide-361-frames.mp4
            ${{ env.OUTPUT }}/render_plan.json
            ${{ env.OUTPUT }}/french_voice.wav
            ${{ env.OUTPUT }}/voice_report.json
            ${{ env.OUTPUT }}/render_receipt.json
            ${{ env.OUTPUT }}/fr-v2v-raw-15s.mp4
            ${{ env.OUTPUT }}/fr-v2v-dubbed-15s.mp4
            ${{ env.OUTPUT }}/final-contact.jpg
            ${{ env.OUTPUT }}/delivery_report.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
      - name: Show exactly what was produced
        if: always()
        shell: bash
        run: |
          echo "## REAL V2V US -> FR, 15 seconds" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: user-selected The AI Advantage YouTube video, 460.24–475.24s. New French script/voice. One GPU call maximum, no redeploy, no publication." >> "$GITHUB_STEP_SUMMARY"
          if test -s "$OUTPUT/fr-v2v-dubbed-15s.mp4"; then
            echo "Final real French-dubbed MP4 ready for human review. Mouth synchronization and character consistency must be reviewed." >> "$GITHUB_STEP_SUMMARY"
          elif test -s "$OUTPUT/fr-v2v-raw-15s.mp4"; then
            echo "Only raw source-guided V2V MP4 produced. Dub failed; don't claim final ready." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No successful final V2V produced. Inspect CPU or GPU logs; do not automatically retry." >> "$GITHUB_STEP_SUMMARY"
          fi
