name: Modal — diagnostic (0 GPU, 0 dépense de rendu)

# Objectif : prouver l'identité du compte Modal et l'état des apps/modèles
# AVANT toute dépense. doctor() tourne sur CPU ; aucun rendu n'est lancé ici.
# Secrets requis (Settings > Secrets and variables > Actions) :
#   MODAL_TOKEN_ID, MODAL_TOKEN_SECRET  (jamais dans le chat ni dans le code)

on:
  workflow_dispatch:
    inputs:
      worker:
        description: Worker à diagnostiquer
        type: choice
        options: [tous, face, lipsync, voice, perf]
        default: tous
      deploy_first:
        description: Déployer le(s) worker(s) avant doctor (build d'image, pas de GPU de rendu)
        type: boolean
        default: false

jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install modal
      - name: Identité du compte (la seule preuve : lue sur le jeton)
        run: |
          modal token info || (echo "Jeton invalide ou absent: vérifier les secrets MODAL_TOKEN_*" && exit 1)
          modal app list | head -n 40
          modal volume list | head -n 40
      - name: Doctor face (FaceFusion)
        if: ${{ inputs.worker == 'tous' || inputs.worker == 'face' }}
        run: |
          ${{ inputs.deploy_first }} && modal deploy deploy/modal_face_worker.py || true
          modal run deploy/modal_face_worker.py --mode doctor
      - name: Doctor lipsync (LatentSync / MuseTalk)
        if: ${{ inputs.worker == 'tous' || inputs.worker == 'lipsync' }}
        run: |
          ${{ inputs.deploy_first }} && modal deploy deploy/modal_lipsync_worker.py || true
          modal run deploy/modal_lipsync_worker.py --mode doctor
      - name: Doctor voice (Chatterbox / Seed-VC)
        if: ${{ inputs.worker == 'tous' || inputs.worker == 'voice' }}
        run: |
          ${{ inputs.deploy_first }} && modal deploy deploy/modal_voice_worker.py || true
          modal run deploy/modal_voice_worker.py --mode doctor
      - name: Doctor perf (WanGP Animate2 / SCAIL-2)
        if: ${{ inputs.worker == 'tous' || inputs.worker == 'perf' }}
        run: |
          ${{ inputs.deploy_first }} && modal deploy deploy/modal_perf_worker.py || true
          modal run deploy/modal_perf_worker.py --mode doctor
