name: US to FR real V2V | inspect source frames before GPU
on:
  push:
    branches: [production/us-fr-v2v-real-video-pilot-20261029]
    paths:
      - productions/US-FR-V2V-REAL-20261029/SOURCE_PROBE_ONCE.txt

permissions:
  contents: read

jobs:
  scan_source:
    if: github.event.head_commit.message == 'RUN_REAL_US_FR_V2V_SOURCE_PROBE_ONCE'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            productions/US-FR-V2V-REAL-20261029
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify one-time request and ffmpeg
        run: |
          test "$(cat productions/US-FR-V2V-REAL-20261029/SOURCE_PROBE_ONCE.txt)" = "US_FR_REAL_SOURCE_INSPECTION_AUTHORIZED"
          command -v ffmpeg && command -v ffprobe
          python -m py_compile productions/US-FR-V2V-REAL-20261029/source_probe.py
      - name: Install source inspector (no GPU, no Modal)
        run: |
          python -m pip install --disable-pip-version-check yt-dlp opencv-python-headless==4.10.0.84 numpy==1.26.4
      - name: Fetch reference and select 15 seconds (CPU only)
        timeout-minutes: 8
        run: python productions/US-FR-V2V-REAL-20261029/source_probe.py
      - name: Upload only the 15sec guide, face scan, and source report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: REAL-US-FR-SOURCE-PROBE-${{ github.run_id }}
          path: |
            productions/US-FR-V2V-REAL-20261029/OUTPUT/source_scan_contact.jpg
            productions/US-FR-V2V-REAL-20261029/OUTPUT/selected_15s_contact.jpg
            productions/US-FR-V2V-REAL-20261029/OUTPUT/source_report.json
            productions/US-FR-V2V-REAL-20261029/OUTPUT/reference-15s.mp4
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
